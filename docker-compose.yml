# SP-01 Dengue Intelligence · despliegue con PostgreSQL/PostGIS, n8n, MLflow y MinIO
# Uso:  docker compose up -d --build
#       http://localhost:8080  (aplicación)
#       http://localhost:5680  (n8n)
#       http://localhost:5050  (MLflow)
#       http://localhost:9001  (consola MinIO)

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dengai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dengai
      POSTGRES_USER: dengai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dengai}
      TZ: America/Lima
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dengai -d dengai"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dengai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dengai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dengai-minio}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: dengai-mlflow
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dengai}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dengai-minio}
      AWS_DEFAULT_REGION: us-east-1
      TZ: America/Lima
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://${MINIO_BUCKET:-dengai}/mlflow
      --serve-artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dengai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # Dentro del contenedor hay que escuchar en todas las interfaces: si se deja
      # 127.0.0.1 el puerto publicado y el proxy de nginx no alcanzan la API.
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg2://dengai:${POSTGRES_PASSWORD:-dengai}@db:5432/dengai
      POSTGIS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en el archivo .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@dengai.unt.edu.pe}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin#Dengue2025}
      MLFLOW_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-SP01-Dengue-Intelligence}
      MLFLOW_ARTIFACT_LOCATION: s3://${MINIO_BUCKET:-dengai}/mlflow
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dengai}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dengai-minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-dengai}
      DATA_MODE: ${DATA_MODE:-auto}
      LIVE_INTEGRATIONS_ENABLED: ${LIVE_INTEGRATIONS_ENABLED:-false}
      TZ: America/Lima
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dengai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  n8n:
    image: n8nio/n8n:1.70.3
    container_name: dengai-n8n
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: America/Lima
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-cambie-esta-clave-de-cifrado}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin-n8n}
      DENGAI_BASE_URL: http://backend:8000/api/v1
      DENGAI_USER: ${BOOTSTRAP_ADMIN_EMAIL:-admin@dengai.unt.edu.pe}
      DENGAI_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin#Dengue2025}
      DENGAI_ALERT_WEBHOOK: ${DENGAI_ALERT_WEBHOOK:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5680:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  app_data:
  n8n_data:
  minio_data:
  mlflow_data:
